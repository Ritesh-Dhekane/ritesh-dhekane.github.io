<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Void: a black screen with white icons. A minimal launcher for your links, notes, calls and messages.">
<title>Void</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui,sans-serif;overscroll-behavior:none}
body{padding:max(24px,env(safe-area-inset-top)) 20px env(safe-area-inset-bottom)}
svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 12px;max-width:520px;margin:0 auto;min-height:80vh;align-content:start}
.t{display:block;aspect-ratio:1;padding:22%;border:0;background:none;touch-action:manipulation;-webkit-touch-callout:none;user-select:none}
.edit .t{animation:w .35s ease-in-out infinite alternate}
@keyframes w{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.t.add{opacity:.4}
#sheet,#note{position:fixed;inset:0;background:#000;display:none;padding:max(24px,env(safe-area-inset-top)) 20px 20px;flex-direction:column;gap:20px}
#sheet.on,#note.on{display:flex}
input,textarea{background:#000;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;font:inherit;width:100%;outline:0}
input:focus,textarea:focus{border-color:#fff}
#note textarea{flex:1;border:0;resize:none;padding:0}
.ic{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ic button,.bar button{aspect-ratio:1;padding:24%;background:none;border:1px solid transparent;border-radius:14px}
.ic button.sel{border-color:#fff}
.bar{display:flex;justify-content:space-between;margin-top:auto}
.bar button{width:56px;padding:14px;aspect-ratio:auto;height:56px}
</style>
</head>
<body>
<div id="grid"></div>

<div id="sheet">
  <input id="url" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://" aria-label="Link, phone number or sms: / wa.me address">
  <div class="ic" id="icons"></div>
  <div class="bar" id="bar"></div>
</div>

<div id="note">
  <button class="t" style="width:56px;height:56px;padding:14px;aspect-ratio:auto" id="back" aria-label="Back"></button>
  <textarea id="txt" aria-label="Note"></textarea>
</div>

<script>
const P={
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
play:'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',
chat:'<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 20 12z"/>',
bag:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
msg:'<rect x="3" y="4" width="18" height="13" rx="3"/><path d="M9 17v4l4-4"/>',
note:'<path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/>',
map:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
music:'<path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
book:'<path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>',
cam:'<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
cart:'<path d="M3 4h3l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>',
money:'<path d="M8 6h8M8 10h8M10 6c5 0 5 7 0 7l5 5"/>',
news:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
game:'<rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4M16 12h.01M18 14h.01"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
left:'<path d="M15 5l-7 7 7 7"/>',
right:'<path d="M9 5l7 7-7 7"/>',
trash:'<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>',
check:'<path d="M5 12l5 5 9-10"/>'
};
const PICK=Object.keys(P).filter(k=>!/^(plus|back|left|right|trash|check)$/.test(k));
const svg=k=>`<svg viewBox="0 0 24 24">${P[k]}</svg>`;
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=ls.get('void.items',[{u:'note:'+Date.now(),i:'note'}]),edit=false,cur=-1,sel='globe',touched=false;
const save=()=>ls.set('void.items',items);

// phone numbers become tel: links; bare hosts get https://
function norm(v){v=v.trim();if(!v)return'';if(/^\+?[\d\s()-]{6,}$/.test(v))return'tel:'+v.replace(/[\s()-]/g,'');return/^[a-z][a-z0-9+.-]*:/i.test(v)?v:'https://'+v}
function guess(u){
  if(u.startsWith('tel:'))return'phone';if(u.startsWith('sms:'))return'msg';if(u.startsWith('mailto:'))return'mail';
  const h=u.toLowerCase();
  return[[/youtu/,'play'],[/chatgpt|openai|claude|gemini|wa\.me|whatsapp/,'chat'],[/amazon|flipkart|myntra|meesho|shop/,'bag'],[/mail/,'mail'],[/maps/,'map'],[/spotify|music/,'music'],[/github/,'code'],[/news/,'news']].find(([r])=>r.test(h))?.[1]||'globe';
}

function render(){
  const g=$('#grid');g.className=edit?'edit':'';
  g.innerHTML=items.map((it,n)=>{
    const btn=it.u.startsWith('note:')||edit;
    return(btn?`<button class="t" data-n="${n}" aria-label="item ${n+1}">`:`<a class="t" href="${it.u}" target="_blank" rel="noopener noreferrer" aria-label="item ${n+1}">`)+svg(it.i)+(btn?'</button>':'</a>');
  }).join('')+(edit?`<button class="t add" data-n="-1" aria-label="add">${svg('plus')}</button>`:'');
}

// notes open on tap; every tile opens the editor while editing
$('#grid').addEventListener('click',e=>{
  const t=e.target.closest('.t');if(!t||skip)return;
  const n=+t.dataset.n;
  if(edit)return open(n);
  if(items[n].u.startsWith('note:'))openNote(items[n].u);
});
$('#grid').addEventListener('contextmenu',e=>e.preventDefault());

// long-press anywhere to enter edit mode; tap empty space to leave it
let timer,skip=false;
document.addEventListener('pointerdown',()=>{
  if(document.querySelector('#sheet.on,#note.on'))return;
  skip=false;clearTimeout(timer);
  timer=setTimeout(()=>{skip=true;edit=true;render()},550);
});
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(timer)));
document.body.addEventListener('click',e=>{if(edit&&!skip&&!e.target.closest('.t,#sheet')){edit=false;render()}});

function open(n){
  cur=n;const it=items[n]||{u:'',i:'globe'};
  const isNote=it.u.startsWith('note:');
  sel=it.i;touched=n>=0;
  $('#url').value=isNote?'':it.u;$('#url').style.display=isNote?'none':'';
  $('#url').oninput=()=>{if(!touched){sel=guess(norm($('#url').value));paint()}};
  paint();
  $('#sheet').classList.add('on');
  if(n<0)$('#url').focus();
}
function paint(){
  $('#icons').innerHTML=PICK.map(k=>`<button data-k="${k}" class="${k===sel?'sel':''}" aria-label="${k}">${svg(k)}</button>`).join('');
  const b=(id,k)=>`<button id="${id}" aria-label="${id}">${svg(k)}</button>`;
  $('#bar').innerHTML=(cur>=0?b('del','trash')+b('lft','left')+b('rgt','right'):'')+b('ok','check');
}
$('#icons').onclick=e=>{const b=e.target.closest('button');if(b){sel=b.dataset.k;touched=true;paint()}};
$('#bar').onclick=e=>{
  const id=e.target.closest('button')?.id;if(!id)return;
  if(id==='del'){const u=items[cur].u;if(u.startsWith('note:'))try{localStorage.removeItem('void.'+u)}catch{}items.splice(cur,1);close()}
  else if(id==='lft'&&cur>0){[items[cur-1],items[cur]]=[items[cur],items[cur-1]];cur--;save();render()}
  else if(id==='rgt'&&cur<items.length-1){[items[cur+1],items[cur]]=[items[cur],items[cur+1]];cur++;save();render()}
  else if(id==='ok'){
    if(cur<0){const u=norm($('#url').value);if(u)items.push({u,i:sel})}
    else{const it=items[cur];if(!it.u.startsWith('note:')){const u=norm($('#url').value);if(u)it.u=u}it.i=sel}
    close();
  }
};
function close(){save();$('#sheet').classList.remove('on');render()}

let noteKey;
function openNote(u){noteKey='void.'+u;$('#txt').value=ls.get(noteKey,'');$('#note').classList.add('on');$('#txt').focus()}
$('#txt').oninput=()=>ls.set(noteKey,$('#txt').value);
$('#back').innerHTML=svg('back');$('#back').onclick=()=>$('#note').classList.remove('on');

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
