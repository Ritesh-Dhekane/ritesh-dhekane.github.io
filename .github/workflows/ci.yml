name: Checks

# Runs on pull requests (releases are PRs from dev into prod). prod's branch protection requires this
# to pass before a PR can be merged. Plain pushes to dev run nothing; deploying is deploy.yml's job.
on:
  pull_request:
    branches: [prod, dev]

permissions:
  contents: read

# A newer push to the same PR cancels the run that is still checking older code.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content checks
        run: npm run check

      - name: Tests
        run: npm test

      # Type check + production build (+ 404.html, sitemap, robots.txt).
      - name: Build
        run: npm run build
